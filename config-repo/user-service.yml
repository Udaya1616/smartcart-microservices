server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartcart_users?createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  admin:
    username: admin
    password: admin123
  jwt:
    secret: smartcart-demo-secret-key-for-jwt-token-signing-2026
    expiration-ms: 86400000
