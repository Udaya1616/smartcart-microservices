server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /api/auth/v3/api-docs
      - name: product-service
        url: /api/products/v3/api-docs
      - name: order-service
        url: /api/orders/v3/api-docs
